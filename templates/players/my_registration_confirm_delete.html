{% extends "base.html" %}
{% block title %}Cancelar inscripción{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h2 class="h4">¿Cancelar tu inscripción en "{{ object.game.name }}"?</h2>
                <p class="text-muted">Podrás volver a inscribirte más tarde.</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger">Sí, cancelar</button>
                    <a href="{% url 'my_profile' %}" class="btn btn-secondary">Volver</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

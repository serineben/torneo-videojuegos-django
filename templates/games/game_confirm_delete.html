{% extends "base.html" %}
{% block title %}Eliminar juego{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h2 class="h4">¿Eliminar "{{ object.name }}"?</h2>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'game_list' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

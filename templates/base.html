<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Torneo de Videojuegos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">🎮 Torneo</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <span class="text-white me-2">Hola, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Iniciar sesión</a>
                <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Registrarse</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>

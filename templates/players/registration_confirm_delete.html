{% extends "base.html" %}
{% block title %}Eliminar inscripción{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h2 class="h4">¿Eliminar la inscripción?</h2>
                <p class="text-muted">{{ object.user.username }} - {{ object.game.name }}</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'participant_detail' object.user.pk %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

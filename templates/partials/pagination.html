{% if is_paginated %}
<nav class="mt-3" aria-label="Paginación">
    <ul class="pagination justify-content-center mb-0">
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.previous_page_number }}">«</a>
            </li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">«</span></li>
        {% endif %}

        {% for num in paginator.page_range %}
            <li class="page-item {% if num == page_obj.number %}active{% endif %}">
                <a class="page-link" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ num }}">{{ num }}</a>
            </li>
        {% endfor %}

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.next_page_number }}">»</a>
            </li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">»</span></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
